<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hausaufgaben</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="screen active">
    <div class="login-box">
      <div class="logo-mark">HA</div>
      <h1>Hausaufgaben<span class="dot">.</span></h1>
      <p class="subtitle">Melde dich mit deiner Schul-E-Mail an.<br>Du bekommst einen Login-Link zugeschickt.</p>
      <div class="input-group">
        <input type="email" id="email-input" placeholder="vorname.nachname@schule.de" autocomplete="email" />
        <button id="magic-link-btn">Link senden →</button>
      </div>
      <p id="login-msg" class="login-msg"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-screen" class="screen">
    <header>
      <button id="prev-day" class="nav-btn">&#8592;</button>
      <div class="header-center">
        <span id="date-display" class="date-display"></span>
        <button id="today-btn" class="today-btn">Heute</button>
      </div>
      <button id="next-day" class="nav-btn">&#8594;</button>
      <div class="header-right">
        <button id="add-hw-btn" class="btn-add" title="Hausaufgabe eintragen">+</button>
        <button id="logout-btn" class="btn-ghost" title="Abmelden">↩</button>
      </div>
    </header>

    <main>
      <div id="hw-list" class="hw-list">
        <div class="loading">Lade Hausaufgaben…</div>
      </div>
    </main>
  </div>

  <!-- ADD OVERLAY -->
  <div id="overlay" class="overlay">
    <div class="overlay-box">
      <div class="overlay-header">
        <h2>Hausaufgabe eintragen</h2>
        <button id="close-overlay" class="btn-close">✕</button>
      </div>
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="subject-input">Fach</label>
          <select id="subject-input">
            <option value="">— Fach wählen —</option>
            <option>Mathematik</option>
            <option>Deutsch</option>
            <option>Englisch</option>
            <option>Physik</option>
            <option>Chemie</option>
            <option>Biologie</option>
            <option>Geschichte</option>
            <option>Geographie</option>
            <option>Informatik</option>
            <option>Kunst</option>
            <option>Musik</option>
            <option>Sport</option>
            <option>Sonstiges</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label for="desc-input">Beschreibung</label>
          <textarea id="desc-input" rows="4" placeholder="Was ist zu tun?"></textarea>
        </div>
      </div>
      <button id="add-btn" class="btn-primary">Eintragen</button>
      <p id="add-msg" class="add-msg"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
